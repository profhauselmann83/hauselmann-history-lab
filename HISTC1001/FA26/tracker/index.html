<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Research Project Tracker</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#fff; --ink:#1d2330; --muted:#667085; --line:#e3e1d9; --accent:#1f4e79;
  --meets:#d9efe1; --meets-ink:#14633a;
  --revise:#fde9c8; --revise-ink:#8a4b00;
  --resub:#d8e6fb; --resub-ink:#1b4a94;
  --sub:#e8e9ee; --sub-ink:#3b4252;
  --exc:#ececec; --exc-ink:#6b6b6b;
  --over:#c0392b;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#14171d; --panel:#1c212b; --ink:#e8eaf0; --muted:#9aa3b2; --line:#2c3340; --accent:#7fb2e5;
    --meets:#1d3d2b; --meets-ink:#8fd6ac; --revise:#463519; --revise-ink:#f0c27a;
    --resub:#1f3354; --resub-ink:#9cc0f5; --sub:#2a303c; --sub-ink:#c5cbd8; --exc:#2a2a2a; --exc-ink:#a0a0a0; --over:#ff7b6b; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.2}
.wrap{max-width:1400px;margin:0 auto;padding:0 16px 48px}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;padding:16px 0 8px}
header.top h1{font-size:20px}
header.top .sub{color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:8px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.danger{color:var(--over)}
.btn.small{padding:3px 8px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.tab{border:1px solid var(--line);background:var(--panel);padding:7px 16px;border-radius:999px;font-weight:600}
.tab[aria-selected=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab small{font-weight:400;opacity:.8;margin-left:6px}
.views{display:flex;gap:18px;border-bottom:1px solid var(--line);margin:6px 0 16px}
.views button{border:0;background:none;padding:8px 2px;color:var(--muted);border-bottom:2px solid transparent}
.views button[aria-selected=true]{color:var(--ink);border-color:var(--accent);font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.card .n{font-size:26px;font-weight:700}
.card .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.card.warn .n{color:var(--over)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.toolbar input[type=search],.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.gridwrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;max-height:72vh}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th,.grid td{border-bottom:1px solid var(--line);padding:0;text-align:center}
.grid thead th{position:sticky;top:0;background:var(--panel);z-index:2;padding:8px 6px;font-size:12px;vertical-align:bottom;min-width:84px;border-bottom:2px solid var(--line)}
.grid th.name,.grid td.name{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;min-width:190px;padding:0 10px;border-right:1px solid var(--line)}
.grid thead th.name{z-index:3}
.grid td.name button{border:0;background:none;padding:9px 0;text-align:left;width:100%;font-weight:500}
.grid td.name button:hover{color:var(--accent);text-decoration:underline}
.grid .wk{color:var(--muted);font-weight:400;display:block}
.grid .due{color:var(--muted);font-weight:400;display:block;font-size:11px}
.grid .ttl{display:block;font-weight:700;font-size:13px}
.bar{height:5px;background:var(--sub);border-radius:3px;margin:5px auto 0;width:60px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--meets-ink)} .bar .r{background:#d98a1c} .bar .s{background:#6c86b5}
.cell{width:100%;height:38px;border:0;border-radius:0;font-weight:700;font-size:15px}
.cell:hover{filter:brightness(.95);outline:2px solid var(--accent);outline-offset:-2px}
.s-meets{background:var(--meets);color:var(--meets-ink)}
.s-revise{background:var(--revise);color:var(--revise-ink)}
.s-resub{background:var(--resub);color:var(--resub-ink)}
.s-sub{background:var(--sub);color:var(--sub-ink)}
.s-exc{background:var(--exc);color:var(--exc-ink)}
.s-missing{background:transparent;color:var(--muted)}
.cell.overdue{box-shadow:inset 0 0 0 2px var(--over);color:var(--over)}
.fbdot{font-size:9px;vertical-align:super;margin-left:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.panel h2{font-size:16px;margin-bottom:8px}
.panel p.help{color:var(--muted);margin:4px 0 10px;font-size:13px}
.field{display:flex;flex-direction:column;gap:3px;font-size:13px}
.field label{color:var(--muted)}
.maprow{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:10px 0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0}
.checks label{font-size:13px;display:inline-flex;gap:4px;align-items:center}
textarea{width:100%;min-height:70px}
table.simple{border-collapse:collapse;width:100%;font-size:13px}
table.simple th,table.simple td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.simple tr.bad td{background:color-mix(in srgb,var(--over) 10%,transparent)}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-8px 0 30px rgba(0,0,0,.18);z-index:20;overflow:auto;padding:16px}
.drawer .hd{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
details.item{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
details.item summary{cursor:pointer;padding:10px 12px;display:flex;gap:8px;align-items:center;list-style:none}
details.item summary::-webkit-details-marker{display:none}
details.item summary .t{flex:1;font-weight:600;font-size:14px}
details.item .body{padding:0 12px 12px}
.fb{border-left:3px solid var(--accent);background:var(--bg);padding:8px 10px;margin:8px 0;border-radius:0 8px 8px 0;white-space:pre-wrap;font-size:14px}
.fb .meta{color:var(--muted);font-size:12px;margin-bottom:4px;display:flex;gap:8px;align-items:center}
.login{max-width:380px;margin:12vh auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.login h1{font-size:20px;margin-bottom:4px}
.login .field{margin:12px 0}
.banner{background:var(--revise);color:var(--revise-ink);padding:8px 14px;border-radius:8px;margin:10px 0;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;max-width:90vw}
.err{color:var(--over);font-size:13px;min-height:1em}
.blur .nm{filter:blur(6px);user-select:none}
.empty{padding:36px;text-align:center;color:var(--muted)}
.find{position:relative;flex:1 1 260px;max-width:340px}
.find input{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px}
.gres{position:absolute;top:100%;left:0;right:0;z-index:30;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:4px;box-shadow:0 8px 24px rgba(0,0,0,.15);overflow:hidden}
.gres button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 12px}
.gres button:hover{background:var(--bg)}
.gres small,.gres .none{color:var(--muted);font-size:12px}
.gres .none{padding:8px 12px}
@media print{
  .find,.np{display:none!important}
  body.print-student .wrap{display:none}
  body.print-student .drawer{position:static;width:auto;box-shadow:none;border:0;overflow:visible;padding:0;background:#fff;display:block!important}
  body.print-student details.item{break-inside:avoid;border-color:#bbb}
  body.print-student .nm{filter:none}
  header.top .spacer,header.top label,header.top button,.tabs .tab:not([aria-selected=true]),.views,.toolbar,.banner,.drawer,.toast{display:none!important}
  body{background:#fff;color:#000}
  .gridwrap{max-height:none;overflow:visible;border:0}
  .grid th.name,.grid td.name,.grid thead th{position:static}
  .cell{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cards{grid-template-columns:repeat(5,1fr)}
  @page{size:landscape;margin:12mm}
}
@media (max-width:640px){ .grid th.name,.grid td.name{min-width:130px} }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
/* ====================================================================
   Helpers
==================================================================== */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const todayStr = () => new Date().toLocaleDateString("en-CA");
const norm = s => String(s ?? "").toLowerCase().replace(/[^a-z0-9@. ]+/g, " ").replace(/\s+/g, " ").trim();
const hash = s => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36) + s.length.toString(36); };
const fmtDate = d => d ? new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" }) : "";
function toast(msg, ms = 3200) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), ms);
}

const STATUS = {
  meets:       { label: "Meets Standard",    sym: "✓", cls: "s-meets" },
  revise:      { label: "Revise & Resubmit", sym: "↻", cls: "s-revise" },
  resubmitted: { label: "Resubmitted",       sym: "⟳", cls: "s-resub" },
  submitted:   { label: "Submitted",         sym: "•", cls: "s-sub" },
  excused:     { label: "Excused",           sym: "E", cls: "s-exc" },
  missing:     { label: "Not yet",           sym: "",  cls: "s-missing" },
};
const DONE = new Set(["meets", "excused"]);

const DEFAULT_ITEMS = [
  ["A1", "Packet A1: Democratic Norms and “Dear Son”", "reading", 8],
  ["CP1", "Checkpoint 1: Terms and Reading Notes", "checkpoint", 8],
  ["A2", "Packet A2: The Nightmare of Despotism and the Documents of 1798", "reading", 8],
  ["CP2", "Checkpoint 2: Research Question Proposal", "checkpoint", 9],
  ["B", "Packet B: The Resolutions and the Debates", "reading", 10],
  ["CP3", "Checkpoint 3: Interview Brief", "checkpoint", 11],
  ["CP4", "Checkpoint 4: Simulation Reflection", "checkpoint", 11],
  ["C", "Packet C: The Sedition Act in Court", "reading", 10],
  ["CP5", "Checkpoint 5: Evidence Map and Outline", "checkpoint", 12],
  ["CP6", "Checkpoint 6: Full Draft", "checkpoint", 13],
  ["FINAL", "Final Paper", "final", 14],
].map(([key, title, kind, week], i) => ({ key, title, kind, week, sort: i + 1 }));

/* ====================================================================
   Tiny CSV / JSON parsing
==================================================================== */
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/, 1)[0] || "";
  const delim = (first.match(/\t/g) || []).length > (first.match(/,/g) || []).length ? "\t" : ",";
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cell); cell = ""; rows.push(row); row = [];
    } else cell += c;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}
function parseTable(text) {
  text = (text || "").trim();
  if (!text) return { headers: [], rows: [] };
  if (text[0] === "[" || text[0] === "{") {
    let data = JSON.parse(text);
    if (!Array.isArray(data)) {
      const arr = Object.values(data).find(Array.isArray);
      data = arr || [data];
    }
    const headers = [];
    data.forEach(o => Object.keys(o || {}).forEach(k => { if (!headers.includes(k)) headers.push(k); }));
    const rows = data.map(o => Object.fromEntries(headers.map(h => [h, o[h] == null ? "" : typeof o[h] === "object" ? JSON.stringify(o[h]) : String(o[h])])));
    return { headers, rows };
  }
  const grid = parseCSV(text);
  const headers = grid[0].map((h, i) => (h || "").trim() || `Column ${i + 1}`);
  const rows = grid.slice(1).map(r => Object.fromEntries(headers.map((h, i) => [h, (r[i] ?? "").trim()])));
  return { headers, rows };
}

/* ====================================================================
   Data layer: Supabase adapter and an in-memory demo adapter
==================================================================== */
const cfg = window.TRACKER_CONFIG || {};
const DEMO = new URLSearchParams(location.search).has("demo") || !(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY) || !window.supabase;

function makeSupabaseApi() {
  const sb = window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);
  async function all(table, order) {
    let out = [], from = 0;
    for (;;) {
      let q = sb.from(table).select("*").range(from, from + 999);
      if (order) q = q.order(order);
      const { data, error } = await q;
      if (error) throw error;
      out = out.concat(data);
      if (data.length < 1000) break;
      from += 1000;
    }
    return out;
  }
  const chunks = (arr, n = 500) => Array.from({ length: Math.ceil(arr.length / n) }, (_, i) => arr.slice(i * n, i * n + n));
  return {
    demo: false, sb,
    async loadAll() {
      const [sections, students, items, progress, feedback, due] = await Promise.all([
        all("sections", "code"), all("students", "last_name"), all("items", "sort"),
        all("progress"), all("feedback", "created_at"), all("due_dates")]);
      return { sections, students, items, progress, feedback, due };
    },
    async setProgress(rows) {
      for (const c of chunks(rows)) {
        const { error } = await sb.from("progress").upsert(c.map(r => ({ ...r, updated_at: new Date().toISOString() })), { onConflict: "student_id,item_key" });
        if (error) throw error;
      }
    },
    async addFeedback(rows) {
      for (const c of chunks(rows)) {
        const { error } = await sb.from("feedback").upsert(c, { onConflict: "student_id,item_key,hash", ignoreDuplicates: true });
        if (error) throw error;
      }
    },
    async deleteFeedback(id) { const { error } = await sb.from("feedback").delete().eq("id", id); if (error) throw error; },
    async upsertStudents(rows) {
      for (const c of chunks(rows)) {
        const { error } = await sb.from("students").upsert(c, { onConflict: "section_id,student_ref" });
        if (error) throw error;
      }
    },
    async setDue(section_id, item_key, due) {
      const q = due
        ? sb.from("due_dates").upsert({ section_id, item_key, due }, { onConflict: "section_id,item_key" })
        : sb.from("due_dates").delete().eq("section_id", section_id).eq("item_key", item_key);
      const { error } = await q; if (error) throw error;
    },
  };
}

function makeDemoApi() {
  const sections = [5631, 5632, 5633].map((c, i) => ({ id: i + 1, code: String(c), title: "HIST C1001 · Section " + c }));
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const F = ["Avery", "Jordan", "Riley", "Casey", "Morgan", "Quinn", "Rowan", "Sage", "Dakota", "Emery", "Harper", "Reese"];
  const L = ["Alder", "Birch", "Cedar", "Dunmore", "Ellery", "Fenwick", "Garrow", "Hollis", "Ingram", "Juniper", "Kestrel", "Linden"];
  const students = [], progress = [], feedback = [];
  const items = DEFAULT_ITEMS;
  let n = 0;
  sections.forEach(s => {
    for (let i = 0; i < 9; i++) {
      const id = "demo-" + (++n);
      students.push({ id, section_id: s.id, student_ref: "D" + (100000 + n * 37), first_name: F[(i + s.id * 3) % 12], last_name: L[(i * 5 + s.id) % 12], email: `student${n}@example.edu` });
      const depth = 4 + Math.floor(rnd() * 3);
      items.forEach((it, k) => {
        if (k >= depth) return;
        const r = rnd();
        const st = r < 0.1 ? null : r < 0.6 ? "meets" : r < 0.85 ? "revise" : "submitted";
        if (!st) return;
        progress.push({ student_id: id, item_key: it.key, status: st, note: null });
        if (it.kind === "checkpoint" && st !== "submitted") feedback.push({
          id: "fb" + feedback.length, student_id: id, item_key: it.key, source: "playlab", hash: "h" + feedback.length, created_at: new Date().toISOString(),
          body: st === "meets" ? "Strengths: Your definition of mutual toleration is in your own words and your examples are specific.\nNext step: Add the timestamp for your second example."
            : "Strengths: Clear effort to connect Schiff to the norms.\nNext step: Two of your five moments are not marked kept, strained, or broken. Revise and Resubmit."
        });
      });
    }
  });
  const base = new Date(); const d = k => { const x = new Date(base); x.setDate(x.getDate() + k); return x.toLocaleDateString("en-CA"); };
  const due = [];
  sections.forEach(s => ["A1:-9", "CP1:-9", "A2:-2", "CP2:-2", "B:5", "CP3:12", "CP4:12", "C:19", "CP5:19", "CP6:26", "FINAL:40"].forEach(p => { const [k, o] = p.split(":"); due.push({ section_id: s.id, item_key: k, due: d(+o) }); }));
  const store = { sections, students, items, progress, feedback, due };
  const clone = o => JSON.parse(JSON.stringify(o));
  return {
    demo: true,
    async loadAll() { return clone(store); },
    async setProgress(rows) { rows.forEach(r => { const i = store.progress.findIndex(p => p.student_id === r.student_id && p.item_key === r.item_key); if (i >= 0) Object.assign(store.progress[i], r); else store.progress.push({ note: null, ...r }); }); },
    async addFeedback(rows) { rows.forEach(r => { if (!store.feedback.some(f => f.student_id === r.student_id && f.item_key === r.item_key && f.hash === r.hash)) store.feedback.push({ id: "fb" + Math.random().toString(36).slice(2), created_at: new Date().toISOString(), ...r }); }); },
    async deleteFeedback(id) { store.feedback = store.feedback.filter(f => f.id !== id); },
    async upsertStudents(rows) { rows.forEach(r => { const i = store.students.findIndex(s => s.section_id === r.section_id && s.student_ref === r.student_ref); if (i >= 0) Object.assign(store.students[i], r); else store.students.push({ id: "demo-new-" + Math.random().toString(36).slice(2), ...r }); }); },
    async setDue(section_id, item_key, dueV) { store.due = store.due.filter(x => !(x.section_id === section_id && x.item_key === item_key)); if (dueV) store.due.push({ section_id, item_key, due: dueV }); },
  };
}

/* ====================================================================
   State
==================================================================== */
let api, D = null;              // D = loaded data
const S = { sectionId: null, view: "grid", hideNames: false, q: "", only: "all", drawer: null, imp: { roster: null, fb: null } };
const progMap = new Map();      // `${student}|${item}` -> row
let dueMap = new Map();         // `${section}|${item}` -> date
let fbByKey = new Map();        // `${student}|${item}` -> [feedback]

function indexData() {
  progMap.clear(); fbByKey.clear(); dueMap = new Map();
  D.progress.forEach(p => progMap.set(p.student_id + "|" + p.item_key, p));
  D.feedback.forEach(f => { const k = f.student_id + "|" + f.item_key; (fbByKey.get(k) || fbByKey.set(k, []).get(k)).push(f); });
  D.due.forEach(x => dueMap.set(x.section_id + "|" + x.item_key, x.due));
  D.students.sort((a, b) => (a.last_name || "").localeCompare(b.last_name || "") || (a.first_name || "").localeCompare(b.first_name || ""));
}
const statusOf = (sid, key) => progMap.get(sid + "|" + key)?.status || "missing";
const dueOf = (secId, key) => dueMap.get(secId + "|" + key) || null;
const isOverdue = (st, secId, key) => { const d = dueOf(secId, key); return st === "missing" && d && d < todayStr(); };
const studentsIn = secId => D.students.filter(s => s.section_id === secId);
const nameOf = s => [s.first_name, s.last_name].filter(Boolean).join(" ") || s.student_ref;
const section = () => D.sections.find(s => s.id === S.sectionId);
const matchesQuery = (s, q) => { const hay = norm(nameOf(s) + " " + s.last_name + " " + s.student_ref + " " + (s.email || "")); return norm(q).split(" ").every(t => hay.includes(t)); };

async function reload() {
  D = await api.loadAll(); indexData();
  if (!D.sections.find(s => s.id === S.sectionId)) S.sectionId = D.sections[0]?.id ?? null;
  render();
}

async function boot() {

  api = makeSupabaseApi();

async function enter() {
  try { await reload(); if (!D.sections.length) throw new Error("no-access"); }
  catch (e) {
    await api.sb.auth.signOut();
    renderLogin("This account is not authorized to view the tracker (or the database is not set up yet). See README step 4.");

}

function statsFor(sec, sts) {
  let done = 0, total = sts.length * D.items.length, revise = 0, over = 0, fb = 0;
  sts.forEach(s => D.items.forEach(it => {
    const st = statusOf(s.id, it.key);
    if (DONE.has(st)) done++; if (st === "revise") revise++; if (isOverdue(st, sec.id, it.key)) over++;
    fb += (fbByKey.get(s.id + "|" + it.key) || []).length;
  }));
  return { done, total, revise, over, fb };
}
function studentFlags(sec, s) {
  let revise = 0, over = 0, any = 0;
  D.items.forEach(it => { const st = statusOf(s.id, it.key); if (st === "revise") revise++; if (isOverdue(st, sec.id, it.key)) over++; if (st !== "missing") any++; });
  return { revise, over, any };
}

function gridHTML(sec, sts) {
  if (!sec) return `<div class="empty">No sections yet. Run schema.sql in Supabase.</div>`;

  const q = norm(S.q);
  const list = sts.filter(s => {
    if (q && !matchesQuery(s, q)) return false;
    const f = studentFlags(sec, s);
    if (S.only === "revise") return f.revise > 0;
    if (S.only === "overdue") return f.over > 0;
    if (S.only === "none") return f.any === 0;

  return `
  <div class="cards">
    <div class="card"><div class="n">${sts.length}</div><div class="l">Students</div></div>
    <div class="card"><div class="n">${Math.round(100 * st.done / Math.max(1, st.total))}%</div><div class="l">Items complete</div></div>
    <div class="card ${st.revise ? "warn" : ""}"><div class="n">${st.revise}</div><div class="l">Awaiting revision</div></div>
    <div class="card ${st.over ? "warn" : ""}"><div class="n">${st.over}</div><div class="l">Overdue, not submitted</div></div>
    <div class="card"><div class="n">${st.fb}</div><div class="l">Feedback entries</div></div>
  </div>
  <div class="toolbar">
    <input type="search" id="q" placeholder="Search students" value="${esc(S.q)}">
    <select id="only">
      ${[["all", "All students"], ["revise", "Has revision requested"], ["overdue", "Has overdue work"], ["none", "No work recorded yet"]].map(([v, l]) => `<option value="${v}" ${S.only === v ? "selected" : ""}>${l}</option>`).join("")}
    </select>
    <span style="color:var(--muted);font-size:13px">${list.length} shown</span>
    <div class="spacer"></div>
    <div class="legend">${["meets", "revise", "resubmitted", "submitted", "excused"].map(k => `<span><span class="pill ${STATUS[k].cls}">${STATUS[k].sym}</span>${STATUS[k].label}</span>`).join("")}<span><span class="pill" style="box-shadow:inset 0 0 0 2px var(--over)">&nbsp;</span>Overdue</span></div>
  </div>
  <div class="gridwrap"><table class="grid">
    <thead><tr><th class="name">Student</th>
    ${D.items.map(it => {
      let m = 0, r = 0, s2 = 0;
      sts.forEach(s => { const x = statusOf(s.id, it.key); if (DONE.has(x)) m++; else if (x === "revise") r++; else if (x !== "missing") s2++; });
      const n = sts.length;
      return `<th title="${esc(it.title)}"><span class="ttl">${esc(it.key === "FINAL" ? "Final" : it.kind === "checkpoint" ? "CP" + it.key.slice(2) : "Packet " + it.key)}</span><span class="wk">Wk ${it.week ?? ""}</span><span class="due">${dueOf(sec.id, it.key) ? "due " + fmtDate(dueOf(sec.id, it.key)) : "no date"}</span>
        <div class="bar" title="${m} complete, ${r} revise, ${s2} submitted of ${n}"><i class="m" style="width:${100 * m / n}%"></i><i class="r" style="width:${100 * r / n}%"></i><i class="s" style="width:${100 * s2 / n}%"></i></div></th>`;
    }).join("")}</tr></thead>
    <tbody>
    ${list.map(s => `<tr><td class="name"><button data-action="open" data-sid="${s.id}"><span class="nm">${esc(nameOf(s))}</span></button></td>

    </tbody></table></div>`;

const csvCell = v => {
  let s = String(v ?? "");
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;           // stop spreadsheets from treating text as a formula
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
function downloadCSV(name, headers, rows) {
  const text = "﻿" + [headers, ...rows].map(r => r.map(csvCell).join(",")).join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: "text/csv;charset=utf-8" }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function doStudentCsv(sid) {
  const s = D.students.find(x => x.id === sid); if (!s) return;
  const code = D.sections.find(x => x.id === s.section_id).code, withNotes = $("#stNotes")?.checked;
  const H = ["Section", "Student ID", "First Name", "Last Name", "Item", "Week", "Due", "Status", ...(withNotes ? ["Private note"] : []), "Feedback"];
  const rows = D.items.map(it => {
    const x = statusOf(sid, it.key), o = isOverdue(x, s.section_id, it.key);
    const fb = (fbByKey.get(sid + "|" + it.key) || []).map(f => f.body).join("\n\n---\n\n");
    return [code, s.student_ref, s.first_name, s.last_name, itemLabel(it), it.week ?? "", dueOf(s.section_id, it.key) || "", o ? "Overdue" : STATUS[x].label,
      ...(withNotes ? [progMap.get(sid + "|" + it.key)?.note || ""] : []), fb];
  });
  downloadCSV(`student-${s.student_ref}-${todayStr()}.csv`.replace(/[^\w.\-]+/g, "_"), H, rows);
}
function doExport(kind) {
  const all = $("#exScope").value === "all", withNotes = $("#exNotes").checked, sec = section();
  const secs = all ? D.sections : [sec], stamp = todayStr(), tag = all ? "all-sections" : sec.code;
  const rowsFor = s => ({ s, code: D.sections.find(x => x.id === s.section_id).code, sid: s.section_id });
  const studs = secs.flatMap(sc => studentsIn(sc.id).map(rowsFor));
  if (!studs.length) return toast("No students to export.");
  const base = r => [r.code, r.s.student_ref, r.s.first_name, r.s.last_name, r.s.email || ""];
  const baseH = ["Section", "Student ID", "First Name", "Last Name", "Email"];
  if (kind === "progress") {
    const H = [...baseH, ...D.items.map(itemLabel), "Items complete", "Revisions requested", "Overdue", ...(withNotes ? ["Private notes"] : [])];
    const rows = studs.map(r => {
      let done = 0, rev = 0, over = 0; const notes = [];
      const cells = D.items.map(it => {
        const x = statusOf(r.s.id, it.key), o = isOverdue(x, r.sid, it.key);
        if (DONE.has(x)) done++; if (x === "revise") rev++; if (o) over++;
        const n = progMap.get(r.s.id + "|" + it.key)?.note; if (n) notes.push(`${itemLabel(it)}: ${n}`);
        return o ? "Overdue" : STATUS[x].label;
      });
      return [...base(r), ...cells, done, rev, over, ...(withNotes ? [notes.join(" | ")] : [])];
    });
    downloadCSV(`tracker-progress-${tag}-${stamp}.csv`, H, rows);
  } else if (kind === "feedback") {
    const H = [...baseH.slice(0, 4), "Item", "Current Status", "Source", "Date", "Feedback"];
    const rows = [];
    studs.forEach(r => D.items.forEach(it => (fbByKey.get(r.s.id + "|" + it.key) || []).forEach(f =>
      rows.push([r.code, r.s.student_ref, r.s.first_name, r.s.last_name, itemLabel(it), STATUS[statusOf(r.s.id, it.key)].label, f.source || "", (f.received_at || f.created_at || "").slice(0, 10), f.body]))));
    if (!rows.length) return toast("No feedback to export yet.");
    downloadCSV(`tracker-feedback-${tag}-${stamp}.csv`, H, rows);
  } else if (kind === "attention") {
    const H = [...baseH, "Revision requested", "Overdue", "Items with work recorded", ...(withNotes ? ["Private notes"] : [])];
    const rows = [];
    studs.forEach(r => {
      const rev = [], over = []; let any = 0; const notes = [];
      D.items.forEach(it => {
        const x = statusOf(r.s.id, it.key);
        if (x === "revise") rev.push(itemLabel(it)); if (isOverdue(x, r.sid, it.key)) over.push(itemLabel(it)); if (x !== "missing") any++;
        const n = progMap.get(r.s.id + "|" + it.key)?.note; if (n) notes.push(`${itemLabel(it)}: ${n}`);
      });
      if (rev.length || over.length || any === 0) rows.push([...base(r), rev.join("; "), over.join("; "), any, ...(withNotes ? [notes.join(" | ")] : [])]);
    });
    if (!rows.length) return toast("Nobody needs attention right now.");
    downloadCSV(`tracker-needs-attention-${tag}-${stamp}.csv`, H, rows);
  }
}

/* ---------------------------- mutations ------------------------------ */
async function setStatus(sid, key, status, note) {
  const old = progMap.get(sid + "|" + key);
  const row = { student_id: sid, item_key: key, status: status ?? old?.status ?? "missing", note: note !== undefined ? note : (old?.note ?? null) };
  try {
    await api.setProgress([row]);
    progMap.set(sid + "|" + key, { ...old, ...row });
    const i = D.progress.findIndex(p => p.student_id === sid && p.item_key === key);
    if (i >= 0) D.progress[i] = progMap.get(sid + "|" + key); else D.progress.push(progMap.get(sid + "|" + key));
  } catch (e) { toast("Could not save: " + e.message); await reload(); }
}
function keepDrawerOpenStates() { return new Set($$("details.item[open]").map(d => d.id)); }
function rerenderKeeping() {
  const open = keepDrawerOpenStates(), sc = $(".drawer")?.scrollTop || 0;
  render(); open.forEach(id => { const d = document.getElementById(id); if (d) d.open = true; });
  const dr = $(".drawer"); if (dr) dr.scrollTop = sc;
}

function guess(headers, re) { return headers.find(h => re.test(h)) || ""; }
function mapperHTML(prefix, headers, fields) {
  return `<div class="maprow">${fields.map(f => `<div class="field"><label>${f.label}${f.req ? " *" : ""}</label>
    <select id="${prefix}-${f.key}"><option value="">${f.req ? "— choose —" : "— none —"}</option>
    ${headers.map(h => `<option value="${esc(h)}" ${guess(headers, f.re) === h ? "selected" : ""}>${esc(h)}</option>`).join("")}</select></div>`).join("")}</div>`;
}
const pick = (prefix, key) => $("#" + prefix + "-" + key)?.value || "";

function wireImport() {
  const readFile = (inp, ta) => inp.addEventListener("change", async () => { const f = inp.files[0]; if (f) ta.value = await f.text(); });
  readFile($("#rosterFile"), $("#rosterText")); readFile($("#fbFile"), $("#fbText"));
  $("#rosterParse").onclick = () => {
    try { S.imp.roster = parseTable($("#rosterText").value); } catch (e) { return toast("Could not read that: " + e.message); }
    const { headers, rows } = S.imp.roster;
    if (!rows.length) return toast("No rows found.");
    $("#rosterOut").innerHTML = `<p><b>${rows.length}</b> rows found. Check the column matches:</p>` +
      mapperHTML("r", headers, [
        { key: "section", label: "Section", re: /section|class|course|crn/i },
        { key: "ref", label: "Student ID / username", re: /student.?id|^id$|user|ref|emplid|cid/i },
        { key: "first", label: "First name", re: /first|given|preferred/i },
        { key: "last", label: "Last name", re: /last|sur|family/i },
        { key: "full", label: "Full name (if no first/last)", re: /^name$|full.?name|student.?name/i },
        { key: "email", label: "Email", re: /e-?mail/i },
      ]) + `<div id="rosterPrev"></div><button class="btn primary" id="rosterGo">Import roster</button>`;
    $$("#rosterOut select").forEach(s => s.onchange = rosterPreview); rosterPreview();
    $("#rosterGo").onclick = rosterCommit;
  };
  $("#fbParse").onclick = () => {
    try { S.imp.fb = parseTable($("#fbText").value); } catch (e) { return toast("Could not read that: " + e.message); }
    const { headers, rows } = S.imp.fb;
    if (!rows.length) return toast("No rows found.");
    const fbGuess = headers.filter(h => /feedback|comment|response|summary|strength|next.?step|suggest|note/i.test(h));
    $("#fbOut").innerHTML = `<p><b>${rows.length}</b> rows found. Tell me what each column is:</p>` +
      mapperHTML("f", headers, [
        { key: "student", label: "Student (ID, email, or full name)", re: /student.?id|^id$|user|e-?mail|^name$|student|full.?name/i, req: true },
        { key: "first", label: "First name (if separate)", re: /first|given/i },
        { key: "last", label: "Last name (if separate)", re: /last|sur|family/i },
        { key: "item", label: "Checkpoint / assignment", re: /checkpoint|assign|task|packet|activity|title/i },
        { key: "status", label: "Result (Meets / Revise)", re: /status|result|mark|grade|standard/i },
        { key: "date", label: "Date", re: /date|time|created|submitted/i },
      ]) +
      `<div class="field"><label>Feedback text columns (tick all that apply)</label><div class="checks">${headers.map(h => `<label><input type="checkbox" name="fbcols" value="${esc(h)}" ${fbGuess.includes(h) ? "checked" : ""}> ${esc(h)}</label>`).join("")}</div></div>
       <div class="maprow"><div class="field"><label>If there is no assignment column, all rows are for</label>
         <select id="f-fixed"><option value="">— use the column above —</option>${D.items.map(i => `<option value="${i.key}">${esc(i.title)}</option>`).join("")}</select></div></div>
       <div class="checks"><label><input type="checkbox" id="f-setstatus" checked> Set “Meets” / “Revise” when the feedback or result column says so</label>
       <label><input type="checkbox" id="f-marksub" checked> Mark as “Submitted” if the student has no status yet</label></div>
       <p><button class="btn" id="fbPreview">Preview matches</button></p><div id="fbPrev"></div>`;
    $("#fbPreview").onclick = fbPreview;
  };
}

/* ---- roster ---- */
function rosterRecords() {
  const { rows } = S.imp.roster, pickv = k => pick("r", k), defSec = +$("#rosterSec").value;
  return rows.map(r => {
    let first = r[pickv("first")] || "", last = r[pickv("last")] || "";
    const full = r[pickv("full")] || "";
    if (!first && !last && full) {
      if (full.includes(",")) { const [l, f] = full.split(",").map(x => x.trim()); last = l; first = f; }
      else { const p = full.trim().split(/\s+/); last = p.length > 1 ? p.pop() : ""; first = p.join(" "); }
    }
    const email = (r[pickv("email")] || "").trim();
    const ref = (r[pickv("ref")] || "").trim() || email.toLowerCase() || norm(first + " " + last);
    const secTxt = r[pickv("section")] || "";
    const found = D.sections.find(s => secTxt.includes(s.code));
    return { section_id: found ? found.id : defSec, secKnown: !pickv("section") || !!found, student_ref: ref, first_name: first, last_name: last, email: email || null };
  }).filter(r => r.student_ref);
}
function rosterPreview() {
  const recs = rosterRecords(), bySec = {};
  recs.forEach(r => bySec[r.section_id] = (bySec[r.section_id] || 0) + 1);
  $("#rosterPrev").innerHTML = `<p>Will import ${recs.length} students: ${D.sections.map(s => bySec[s.id] ? `<b>${bySec[s.id]}</b> into ${esc(s.code)}` : "").filter(Boolean).join(", ")}.
    ${recs.some(r => !r.secKnown) ? `<span class="err">Some rows have a section value I don't recognize; they go to the default section.</span>` : ""}</p>
    <table class="simple"><thead><tr><th>Section</th><th>ID</th><th>First</th><th>Last</th><th>Email</th></tr></thead><tbody>
    ${recs.slice(0, 5).map(r => `<tr><td>${esc(D.sections.find(s => s.id === r.section_id)?.code)}</td><td>${esc(r.student_ref)}</td><td>${esc(r.first_name)}</td><td>${esc(r.last_name)}</td><td>${esc(r.email)}</td></tr>`).join("")}</tbody></table>`;
}
async function rosterCommit() {
  const recs = rosterRecords().map(({ secKnown, ...r }) => r);
  if (!recs.length) return toast("Nothing to import.");
  try { await api.upsertStudents(recs); toast(`Imported ${recs.length} students.`); S.imp.roster = null; S.view = "grid"; await reload(); }
  catch (e) { toast("Import failed: " + e.message, 6000); }
}

/* ---- feedback ---- */
function buildIndex(students) {
  const idx = new Map(), add = (k, s) => { k = norm(k); if (!k) return; const a = idx.get(k) || idx.set(k, []).get(k); if (!a.includes(s)) a.push(s); };
  students.forEach(s => {
    add(s.student_ref, s); add(s.email, s);
    add(`${s.first_name} ${s.last_name}`, s); add(`${s.last_name} ${s.first_name}`, s);
    if (s.first_name) {
      const f1 = s.first_name.split(/\s+/)[0], lt = (s.last_name || "").split(/\s+/);
      add(`${f1} ${s.last_name}`, s);                 // drops middle names
      if (lt.length > 1) { add(`${f1} ${lt[0]}`, s); add(`${f1} ${lt[lt.length - 1]}`, s); }  // compound last names
    }
  });
  return idx;
}
/* "Closest name" suggestions: never applied automatically, only offered for you to confirm. */
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
const ratio = (a, b) => (a || b) ? 1 - lev(a, b) / Math.max(a.length, b.length) : 0;
function suggestNames(pool, who) {
  const t = norm(who).split(" ").filter(Boolean);
  if (t.length < 2 || /@/.test(who)) return [];
  const sf = t[0], sl = t[t.length - 1];
  return pool.map(s => {
    const ff = norm(s.first_name).split(" ")[0] || "", ll = norm(s.last_name).split(" ").filter(Boolean);
    const lastScore = Math.max(0, ...ll.map(x => ratio(sl, x)), ratio(sl, ll.join(" ")));
    let firstScore = ratio(sf, ff);
    if (sf.length >= 3 && ff.length >= 3 && (ff.startsWith(sf) || sf.startsWith(ff))) firstScore = Math.max(firstScore, 0.9);  // Zac / Zachary
    let score = 0.55 * lastScore + 0.45 * firstScore;
    const swapped = 0.55 * Math.max(0, ...ll.map(x => ratio(sf, x))) + 0.45 * ratio(sl, ff);   // "Last First" order
    score = Math.max(score, swapped);
    return { s, score };
  }).filter(x => x.score >= 0.72).sort((a, b) => b.score - a.score).slice(0, 3);
}
function findStudent(idx, cands) {
  for (const c of cands) {
    const k = norm(c); if (!k) continue;
    let hit = idx.get(k);
    if (!hit) { const em = String(c).match(/[\w.+-]+@[\w.-]+\.\w+/); if (em) hit = idx.get(norm(em[0])); }
    if (!hit) { const p = k.split(" "); if (p.length > 2) hit = idx.get(p[0] + " " + p[p.length - 1]); }
    if (hit) return hit.length === 1 ? { s: hit[0] } : { amb: true };
  }
  return {};
}
function matchItem(text) {
  const t = String(text || "").toLowerCase();
  if (!t.trim()) return null;
  const direct = D.items.find(i => i.key.toLowerCase() === t.trim() || norm(i.title) === norm(t));
  if (direct) return direct.key;
  if (/final/.test(t) && !/draft/.test(t)) return "FINAL";
  let m = t.match(/check\s*-?\s*point\s*#?\s*(\d)/) || t.match(/\bcp\s*-?\s*(\d)\b/) || t.match(/\bchk\s*-?\s*(\d)\b/);
  if (m) return "CP" + m[1];
  m = t.match(/packet\s*-?\s*([abc])(?:\s*-?\s*(?:,?\s*part\s*)?([12]))?(?![a-z0-9])/);
  if (m) return m[1] === "a" ? "A" + (m[2] || (/part\s*2/.test(t) ? "2" : "1")) : m[1].toUpperCase();
  const titleHit = D.items.find(i => { const w = norm(i.title.split(":").pop()).split(" ").filter(x => x.length > 3); return w.length >= 2 && w.filter(x => t.includes(x)).length >= Math.max(2, Math.ceil(w.length * 0.67)); });
  return titleHit ? titleHit.key : null;
}
function statusFromText(t) {
  t = String(t || "").toLowerCase();
  const rev = /revise\s*(and|&)?\s*resubmit|needs?\s+revision/.test(t), meet = /(?<!not\s)(?<!does not\s)meets?\s+(the\s+)?standard/.test(t);
  if (rev && !meet) return "revise"; if (meet && !rev) return "meets"; return null;
}
let fbRecords = [];
function fbPreview() {
  const { rows } = S.imp.fb, g = k => pick("f", k), fixed = $("#f-fixed").value;
  if (!g("student") && !g("last")) return toast("Choose the student column first.");
  const cols = $$('input[name=fbcols]:checked').map(c => c.value);
  if (!cols.length) return toast("Tick at least one feedback column.");
  if (!g("item") && !fixed) return toast("Choose an assignment column, or pick the assignment for all rows.");
  const scope = $("#fbScope").value, pool = scope === "all" ? D.students : D.students.filter(s => s.section_id === +scope), idx = buildIndex(pool);
  fbRecords = rows.map((r, n) => {
    const cands = [r[g("student")], `${r[g("first")] || ""} ${r[g("last")] || ""}`.trim()].filter(Boolean);
    const m = findStudent(idx, cands), item = fixed || matchItem(r[g("item")]);
    const body = (cols.length === 1 ? r[cols[0]] : cols.map(c => r[c] ? `${c}: ${r[c]}` : "").filter(Boolean).join("\n")).trim();
    const stat = statusFromText(r[g("status")]) || statusFromText(body);
    const problem = !body ? "empty feedback" : m.amb ? "more than one student matches" : !m.s ? "student not found" : !item ? "assignment not recognized" : "";
    const nameLike = cands.find(c => /\s/.test(c.trim()) && !/@/.test(c)) || "";
    const sug = !m.s && !m.amb && nameLike ? suggestNames(pool, nameLike) : [];
    return { n, s: m.s, item, body, stat, problem, sug, pick: null, date: r[g("date")] || "", who: cands[0] || "" };
  });
  fbRecords.sort((a, b) => !!b.problem - !!a.problem || a.n - b.n);
  renderFbPreview();
}
function fbEffectiveProblem(r) {
  if (!r.pick) return r.problem;
  return !r.body ? "empty feedback" : !r.item ? "assignment not recognized" : "";
}
function renderFbPreview() {
  const prob = r => fbEffectiveProblem(r), ok = fbRecords.filter(r => !prob(r)), bad = fbRecords.length - ok.length;
  const sugCount = fbRecords.filter(r => r.sug.length && !r.pick).length;
  $("#fbPrev").innerHTML = `<p><b>${ok.length}</b> ready to import${bad ? `, <b class="err">${bad}</b> need attention (shown in red; they will be skipped)` : ""}.
    ${sugCount ? `<br>For <b>${sugCount}</b> unmatched rows I found a similar name. Check the dropdown in the Student column and choose the right person, or leave it to skip the row.` : ""}</p>
  <div style="max-height:360px;overflow:auto"><table class="simple"><thead><tr><th>Row</th><th>Student</th><th>Item</th><th>Status</th><th>Feedback</th></tr></thead><tbody>
  ${fbRecords.slice(0, 200).map(r => {
    const p = prob(r), sec = r.s ? D.sections.find(x => x.id === r.s.section_id)?.code : "";
    const stuCell = r.sug.length
      ? `<span class="nm">${esc(r.who)}</span><br><select data-fbpick="${r.n}"><option value="">Skip this row</option>${r.sug.map(x => `<option value="${x.s.id}" ${r.pick === x.s.id ? "selected" : ""}>${esc(nameOf(x.s))} · ${esc(D.sections.find(z => z.id === x.s.section_id)?.code)} (${Math.round(x.score * 100)}% similar)</option>`).join("")}</select>`
      : r.s ? `<span class="nm">${esc(nameOf(r.s))}</span> <span style="color:var(--muted)">${esc(sec)}</span>` : esc(r.who);
    return `<tr class="${p ? "bad" : ""}"><td>${r.n + 2}</td><td>${stuCell}</td><td>${esc(r.item || "?")}</td>
    <td>${p ? esc(p) : r.stat ? STATUS[r.stat].label : "—"}</td><td>${esc(r.body.slice(0, 110))}${r.body.length > 110 ? "…" : ""}</td></tr>`;
  }).join("")}</tbody></table></div>
  <p style="margin-top:10px"><button class="btn primary" id="fbGo" ${ok.length ? "" : "disabled"}>Import ${ok.length} feedback entries</button></p>`;
  $("#fbGo").onclick = fbCommit;
}
async function fbCommit() {
  const ok = fbRecords.filter(r => !fbEffectiveProblem(r)), setStat = $("#f-setstatus").checked, markSub = $("#f-marksub").checked;
  const fbRows = ok.map(r => ({ student_id: r.s.id, item_key: r.item, body: r.body, source: "playlab", hash: hash(r.body),
    received_at: r.date && !isNaN(new Date(r.date)) ? new Date(r.date).toISOString() : null }));
  const prog = new Map();
  ok.forEach(r => {
    const k = r.s.id + "|" + r.item, cur = prog.get(k)?.status ?? statusOf(r.s.id, r.item), old = progMap.get(k);
    let next = null;
    if (setStat && r.stat && cur !== "excused") next = r.stat;
    else if (markSub && cur === "missing") next = "submitted";
    if (next) prog.set(k, { student_id: r.s.id, item_key: r.item, status: next, note: old?.note ?? null });
  });
  try {
    await api.addFeedback(fbRows);
    if (prog.size) await api.setProgress([...prog.values()]);
    toast(`Imported ${fbRows.length} feedback entries; updated ${prog.size} statuses.`, 5000);
    S.imp.fb = null; S.view = "grid"; await reload();
  } catch (e) { toast("Import failed: " + e.message, 7000); }
}

/* ====================================================================
   Events
==================================================================== */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  if (a === "section") { S.sectionId = +el.dataset.id; S.drawer = null; render(); }
  else if (a === "view") { S.view = el.dataset.view; S.drawer = null; render(); }
  else if (a === "open") { S.drawer = { sid: el.dataset.sid, item: el.dataset.item || null }; renderDrawer(); }
  else if (a === "close") { S.drawer = null; $("#drawerMount").innerHTML = ""; render(); }
  else if (a === "export") doExport(el.dataset.kind);
  else if (a === "pickstudent") {
    const s = D.students.find(x => x.id === el.dataset.sid); if (!s) return;
    S.sectionId = s.section_id; S.view = "grid"; S.q = ""; S.only = "all"; S.drawer = { sid: s.id, item: null }; render();
  }
  else if (a === "stuCsv") doStudentCsv(el.dataset.sid);
  else if (a === "stuPrint") {
    $$("details.item").forEach(d => d.open = true);
    document.body.classList.add("print-student");
    const done = () => { document.body.classList.remove("print-student"); window.removeEventListener("afterprint", done); };
    window.addEventListener("afterprint", done); window.print();
  }
  else if (a === "print") { S.view = "grid"; S.drawer = null; render(); setTimeout(() => window.print(), 100); }
  else if (a === "signout") { await api.sb.auth.signOut(); D = null; renderLogin(); }
  else if (a === "delfb") {
    if (!confirm("Delete this feedback entry?")) return;
    try { await api.deleteFeedback(el.dataset.id); await reload(); } catch (err) { toast("Could not delete: " + err.message); }
  } else if (a === "addfb") {
    const ta = $(`textarea[data-newfb][data-item="${el.dataset.item}"]`), body = ta.value.trim(); if (!body) return;
    try { await api.addFeedback([{ student_id: el.dataset.sid, item_key: el.dataset.item, body, source: "manual", hash: hash(body), received_at: null }]); await reload(); }
    catch (err) { toast("Could not save: " + err.message); }
  } else if (a === "copyDue") {
    const sec = section(); if (!confirm(`Copy ${sec.code}'s dates to the other sections?`)) return;
    try { for (const o of D.sections) if (o.id !== sec.id) for (const it of D.items) await api.setDue(o.id, it.key, dueOf(sec.id, it.key)); await reload(); toast("Dates copied."); }
    catch (err) { toast("Could not copy: " + err.message); }
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.action === "toggleNames") { S.hideNames = t.checked; rerenderKeeping(); }
  else if (t.id === "only") { S.only = t.value; render(); }
  else if (t.dataset.fbpick !== undefined) {
    const r = fbRecords.find(x => x.n === +t.dataset.fbpick);
    r.pick = t.value || null; r.s = r.pick ? D.students.find(s => s.id === r.pick) : undefined;
    renderFbPreview();
  }
  else if (t.matches("select[data-status]")) { await setStatus(t.dataset.sid, t.dataset.item, t.value); rerenderKeeping(); }
  else if (t.matches("textarea[data-note]")) { await setStatus(t.dataset.sid, t.dataset.item, undefined, t.value.trim() || null); toast("Note saved", 1200); }
  else if (t.dataset.due !== undefined && t.type === "date") {
    const sec = section();
    try { await api.setDue(sec.id, t.dataset.due, t.value); if (t.value) dueMap.set(sec.id + "|" + t.dataset.due, t.value); else dueMap.delete(sec.id + "|" + t.dataset.due); toast("Saved", 1000); }
    catch (err) { toast("Could not save: " + err.message); }
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "gq") {
    const q = e.target.value.trim(), box = $("#gres");
    if (!q) { box.hidden = true; return; }
    const hits = D.students.filter(s => matchesQuery(s, q)).slice(0, 8);
    box.innerHTML = hits.length
      ? hits.map(s => `<button data-action="pickstudent" data-sid="${s.id}"><span class="nm">${esc(nameOf(s))}</span><small>${esc(D.sections.find(x => x.id === s.section_id)?.code)} · <span class="nm">${esc(s.student_ref)}</span></small></button>`).join("")
      : `<div class="none">No student found</div>`;
    box.hidden = false; return;
  }
  if (e.target.id === "q") {
    S.q = e.target.value; const pos = e.target.selectionStart;
    render(); const q = $("#q"); q.focus(); q.setSelectionRange(pos, pos);
  }
});
document.addEventListener("click", e => { if (!e.target.closest(".find")) { const b = $("#gres"); if (b) b.hidden = true; } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.drawer) { S.drawer = null; render(); } });

boot().catch(e => { $("#app").innerHTML = `<div class="login"><h1>Could not start</h1><p class="err">${esc(e.message)}</p></div>`; });
</script>
